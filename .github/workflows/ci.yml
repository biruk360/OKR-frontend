name: CI

on:
  push:
    branches:
      - 'agent/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: "file:./dev.db"
      NEXTAUTH_SECRET: "ci-placeholder-secret"
      NEXTAUTH_URL: "http://localhost:3000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Daily Scrum tests
        run: npm run test:scrum

      - name: Sprint board unit tests
        run: |
          npm run test:sprints
          npm run test:cards
          npm run test:todos

      - name: Security invariants
        # Static guards: every API route carries an auth wrapper (or a named
        # exemption that proves its own guard), card sharing mints no tokens and
        # stays under /dashboard, and scripts/preflight.sql is safe to re-run.
        # The preflight check matters most here — deploy.sh runs that file against
        # production with ON_ERROR_STOP=1, so a non-idempotent statement aborts a
        # deploy midway.
        run: npm run test:security

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Next.js build
        run: npm run build
