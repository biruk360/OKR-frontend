name: CI + Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────
  # Build gate: typecheck + prisma generate + next build.
  # Runs on every push; deploy only fires if this passes.
  # ───────────────────────────────────────────────
  build:
    name: Build & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # dummy DB url so `prisma generate` resolves — the real app uses SQLite via schema.prisma url.
      DATABASE_URL: "file:./dev.db"
      # next build needs a secret in prod-mode; any non-empty placeholder is fine for the build.
      NEXTAUTH_SECRET: "ci-placeholder-secret"
      NEXTAUTH_URL: "http://localhost:3000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Next.js build
        run: npm run build

  # ───────────────────────────────────────────────
  # Deploy: SSH into VPS and run scripts/deploy.sh.
  # Depends on build so broken code never ships.
  # ───────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_DIR: ${{ secrets.VPS_APP_DIR }}
      DEPLOY_BRANCH: ${{ vars.VPS_DEPLOY_BRANCH || 'main' }}
      VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
    steps:
      # Fail fast with a clear message if any required secret is missing or empty,
      # and surface safe diagnostics (lengths only — GitHub masks secret content
      # in logs so lengths are the only thing we can inspect).
      - name: Assert required secrets are set
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          fail=0
          [ -n "$VPS_HOST" ] || { echo "::error::VPS_HOST secret is empty or unset"; fail=1; }
          [ -n "$VPS_USERNAME" ] || { echo "::error::VPS_USERNAME secret is empty or unset"; fail=1; }
          [ -n "$VPS_SSH_KEY" ] || { echo "::error::VPS_SSH_KEY secret is empty or unset"; fail=1; }
          [ -n "$VPS_APP_DIR" ] || { echo "::error::VPS_APP_DIR secret is empty or unset"; fail=1; }
          [ "$fail" = "0" ] || exit 1
          echo "VPS_HOST length: ${#VPS_HOST}"
          echo "VPS_USERNAME length: ${#VPS_USERNAME}"
          echo "VPS_SSH_KEY length: ${#VPS_SSH_KEY} (expected ~400 for ed25519)"
          echo "VPS_APP_DIR length: ${#VPS_APP_DIR}"
          # Key header/footer: these are not sensitive, they're standard OpenSSH markers.
          first=$(printf '%s' "$VPS_SSH_KEY" | head -1)
          last=$(printf '%s' "$VPS_SSH_KEY" | tail -1)
          case "$first" in
            *"BEGIN OPENSSH PRIVATE KEY"*) echo "VPS_SSH_KEY header: OK (OpenSSH)" ;;
            *"BEGIN RSA PRIVATE KEY"*) echo "VPS_SSH_KEY header: OK (RSA PEM)" ;;
            *) echo "::warning::VPS_SSH_KEY header looks wrong: $first" ;;
          esac
          case "$last" in
            *"END OPENSSH PRIVATE KEY"*|*"END RSA PRIVATE KEY"*) echo "VPS_SSH_KEY footer: OK" ;;
            *) echo "::warning::VPS_SSH_KEY footer looks wrong: $last" ;;
          esac

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ env.VPS_SSH_PORT }}
          envs: APP_DIR,DEPLOY_BRANCH
          script: |
            set -e
            if [ -z "$APP_DIR" ]; then
              echo "Missing APP_DIR (set secret VPS_APP_DIR to the repo path on the VPS)"
              exit 1
            fi
            bash "$APP_DIR/scripts/deploy.sh"
