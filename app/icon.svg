<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="OKR Workspace">
  <!-- Colours are literal because this is a standalone image file that no
       stylesheet reaches: #0267C7 is --ap-accent and #6B58D9 is the second stop
       of the sign-in CTA gradient, both converted from their oklch definitions
       in app/globals.css. Keep them in step if the accent is ever retargeted. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0267C7"/>
      <stop offset="1" stop-color="#6B58D9"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7.5" fill="url(#g)"/>
  <!-- A target: one ring and a centre, sized to still read as a target at 16px
       where a three-ring Lucide icon turns to mush. -->
  <circle cx="16" cy="16" r="8.6" fill="none" stroke="#fff" stroke-width="2.6" opacity="0.92"/>
  <circle cx="16" cy="16" r="3.4" fill="#fff"/>
</svg>
