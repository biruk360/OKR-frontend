# Include in nginx's http context (/etc/nginx/conf.d/okr-performance.conf).
# Ordinary HTTP requests must not carry Connection: upgrade. Preserve WebSockets.
map $http_upgrade $okr_connection_upgrade {
    default upgrade;
    ''      '';
}

upstream okr_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# No query strings, cookies, or request bodies in performance logs.
log_format okr_timing '$time_iso8601 method=$request_method uri=$uri status=$status '
                      'bytes=$body_bytes_sent request_time=$request_time '
                      'upstream_time=$upstream_response_time upstream_status=$upstream_status';
