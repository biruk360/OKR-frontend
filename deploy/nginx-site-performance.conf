# Include inside the existing TLS server block. No cache for authenticated pages/APIs.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml application/xml;
access_log /var/log/nginx/okr-performance.log okr_timing;
